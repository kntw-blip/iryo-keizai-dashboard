name: build-and-publish
# raw ブランチの一次データ → JSON加工 → 検証 → gh-pages ブランチへ公開
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**, scripts/**, .github/workflows/build.yml]
  workflow_run:
    workflows: [fetch-raw]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: raw, path: raw }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install python-calamine
      - name: Build data
        shell: bash   # pipefail を有効にして、検証の失敗でビルドを止める
        run: |
          mkdir -p site/data
          python scripts/build_data.py raw site/data 2>&1 | tee build_log.txt
          python scripts/build_hosp.py raw/dpc/core.json site/data 2>&1 | tee -a build_log.txt
          python scripts/verify.py site/data/mes.json 2>&1 | tee -a build_log.txt
          echo "::notice title=build::$(tail -c 2500 build_log.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Publish to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "publish $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
